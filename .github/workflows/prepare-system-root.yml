name: Prepare Editable System Root

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout optimizer repository
        uses: actions/checkout@v4

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/gsi-optimizer/extracted"

          {
            echo "===== RUNNER ====="
            date -u
            nproc
            free -h
            df -h /
          } | tee "$GITHUB_WORKSPACE/gsi-report.txt"

      - name: Download GSI
        shell: bash
        run: |
          set -euo pipefail

          ASSET_API="https://api.github.com/repos/Lost-Entrepreneur439/LineageOS-a64_gsi/releases/assets/452705009"

          curl -fL --show-error \
            --retry 8 --retry-all-errors \
            --retry-delay 10 --retry-max-time 900 \
            --connect-timeout 45 \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ASSET_API" \
            -o "$RUNNER_TEMP/gsi-optimizer/gsi.tar.xz"

          test "$(stat -c %s "$RUNNER_TEMP/gsi-optimizer/gsi.tar.xz")" -eq 739635436

          echo "b942b856f7aa72d2f881c933a936a4bc9c438520fad43eebdd4287addc6f2889  $RUNNER_TEMP/gsi-optimizer/gsi.tar.xz" \
            | sha256sum -c -

          {
            echo
            echo "===== ARCHIVE ====="
            ls -lh "$RUNNER_TEMP/gsi-optimizer/gsi.tar.xz"
          } | tee -a "$GITHUB_WORKSPACE/gsi-report.txt"

      - name: Extract GSI
        shell: bash
        run: |
          set -euo pipefail

          tar -xJf "$RUNNER_TEMP/gsi-optimizer/gsi.tar.xz" \
            -C "$RUNNER_TEMP/gsi-optimizer/extracted"

          find "$RUNNER_TEMP/gsi-optimizer/extracted" \
            -type f -iname "*.img" -printf '%s bytes | %p\n' \
            | tee "$GITHUB_WORKSPACE/extracted-images.txt"

      - name: Mount and modify EXT4 system root
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_FILE="$(find "$RUNNER_TEMP/gsi-optimizer/extracted" \
            -type f -iname "*.img" -print -quit)"

          if [[ -z "$IMAGE_FILE" ]]; then
            echo "ERROR: No image found"
            exit 1
          fi

          FS_TYPE="$(blkid -p -s TYPE -o value "$IMAGE_FILE" || true)"

          echo "Detected filesystem: $FS_TYPE"

          if [[ "$FS_TYPE" != "ext4" ]]; then
            echo "ERROR: Expected EXT4, detected: $FS_TYPE"
            exit 1
          fi

          SYSTEM_ROOT="$RUNNER_TEMP/system-root"

          mkdir -p "$SYSTEM_ROOT"

          echo "IMAGE_FILE=$IMAGE_FILE" >> "$GITHUB_ENV"
          echo "SYSTEM_ROOT=$SYSTEM_ROOT" >> "$GITHUB_ENV"

          sudo mount -t ext4 \
            -o loop,rw,nosuid,nodev,noexec \
            "$IMAGE_FILE" "$SYSTEM_ROOT"

          if ! mountpoint -q "$SYSTEM_ROOT"; then
            echo "ERROR: EXT4 mount failed"
            exit 1
          fi

          echo "===== MOUNT SUCCESS ====="

          {
            echo
            echo "===== SYSTEM ROOT TOP LEVEL ====="
            sudo find "$SYSTEM_ROOT" -mindepth 1 -maxdepth 2 \
              -printf '%y %m %u:%g %p\n' | sort

            echo
            echo "===== BUILD.PROP FILES ====="
            sudo find "$SYSTEM_ROOT" -maxdepth 4 \
              -type f -name "build.prop" -print

            echo
            echo "===== FILESYSTEM DISK USAGE ====="
            sudo du -sh "$SYSTEM_ROOT"
          } | tee -a "$GITHUB_WORKSPACE/gsi-report.txt"

          echo "===== TESTING WRITE ACCESS ====="
          sudo touch "$SYSTEM_ROOT/.optimizer_write_probe"
          sudo test -f "$SYSTEM_ROOT/.optimizer_write_probe"
          sudo rm "$SYSTEM_ROOT/.optimizer_write_probe"

          echo "Write test successful."

          echo "===== APPLYING MODIFICATION SCRIPT ====="
          sudo bash scripts/modify_system.sh \
            "$SYSTEM_ROOT" \
            "$GITHUB_WORKSPACE/config/system.prop" \
            | tee -a "$GITHUB_WORKSPACE/gsi-report.txt"

          {
            echo
            echo "===== BUILD.PROP AFTER MODIFICATION ====="
            sudo find "$SYSTEM_ROOT" -maxdepth 4 \
              -type f -name "build.prop" -exec sh -c '
                for file do
                  echo "--- $file"
                  grep -v "^[[:space:]]*#" "$file" | tail -n 30
                done
              ' sh {} +

            echo
            echo "===== SAMPLE SELINUX METADATA ====="
            if command -v getfattr >/dev/null 2>&1; then
              PROP_FILE="$SYSTEM_ROOT/build.prop"
              if [[ ! -f "$PROP_FILE" ]]; then
                PROP_FILE="$SYSTEM_ROOT/system/build.prop"
              fi
              sudo getfattr -n security.selinux --only-values \
                "$PROP_FILE" 2>&1 || true
            else
              echo "getfattr not installed; label inspection skipped."
            fi

            echo
            echo "===== FINAL DISK ====="
            df -h /
          } | tee -a "$GITHUB_WORKSPACE/gsi-report.txt"

          sudo find "$SYSTEM_ROOT" -mindepth 1 -maxdepth 2 \
            -printf '%y %m %u:%g %p\n' \
            | sort > "$GITHUB_WORKSPACE/system-tree.txt"

      - name: Unmount system root
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          SYSTEM_ROOT="$RUNNER_TEMP/system-root"

          if mountpoint -q "$SYSTEM_ROOT"; then
            sudo sync
            sudo umount "$SYSTEM_ROOT"
            echo "System root unmounted successfully."
          else
            echo "System root is not mounted."
          fi

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editable-system-root-report
          path: |
            gsi-report.txt
            system-tree.txt
            extracted-images.txt
          if-no-files-found: warn
          retention-days: 7
